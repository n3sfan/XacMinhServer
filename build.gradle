import java.nio.file.Files

plugins {
    id "org.springframework.boot" version "2.7.0"
    id 'io.spring.dependency-management' version '1.0.11.RELEASE'
    id 'java'
}

group 'me.lethinh.xacminhserver'
version '1.0'
sourceCompatibility = '1.8'
targetCompatibility = '1.8'

repositories {
    mavenCentral()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    runtime.exclude module: 'spring-boot-starter-logging'
}

dependencies {
    testImplementation group: 'junit', name: 'junit', version: '4.12'
    implementation 'org.ow2.asm:asm:9.3'
    implementation 'org.xerial:sqlite-jdbc:3.36.0.3'
    implementation 'org.springframework.boot:spring-boot-starter-web:2.7.0'
    testImplementation('org.springframework.boot:spring-boot-starter-test:2.7.0') {
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }
    implementation 'org.springframework.boot:spring-boot-starter-log4j2:2.7.0'
    implementation 'com.github.vladimir-bukhtoyarov:bucket4j-core:7.5.0'
    compileOnly 'org.projectlombok:lombok:1.18.24'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'
    implementation 'com.google.guava:guava:31.1-jre'



    // Upgrade, no CVEs
//    implementation("com.jayway.jsonpath:json-path:2.9.0")
//    implementation("com.fasterxml.jackson.core:jackson-databind:2.14.3")
//    implementation "org.apache.tomcat.embed:tomcat-embed-core:11.0.0"
//    implementation "org.apache.tomcat.embed:tomcat-embed-websocket:11.0.0"
//    implementation 'org.springframework.boot:spring-boot-autoconfigure:2.7.18'
//    implementation 'org.springframework.boot:spring-boot:2.7.18'
//    implementation 'org.springframework:spring-core:6.1.3'
//    implementation 'org.springframework.boot:spring-boot-jarmode-layertools:2.7.18'

    modules {
        module("org.springframework.boot:spring-boot-starter-logging") {
            replacedBy("org.springframework.boot:spring-boot-starter-log4j2")
        }
    }

}

bootJar {
    mainClass = 'me.lethinh.xacminhserver.XacMinhApplication'
}

jar {
    from {
        configurations.runtimeClasspath.collect { it.name.contains("asm") ? zipTree(it) : null }
    }
    from {
        configurations.runtimeClasspath.filter { !it.name.contains("asm") }.forEach { File file ->
            copy {
                from file.absolutePath
                into "$buildDir/libs/libs"
            }
        }
    }

    manifest {
        attributes 'Main-Class': 'me.lethinh.xacminhserver.XacMinhServer',
                'Class-Path': configurations.runtimeClasspath.collect { './libs/' + it.name }.join(' ')
    }
}

def jarName = "$project.name-$project.version"
def java8Path = "C:\\Program Files\\Eclipse Adoptium\\jdk-8.0.462.8-hotspot"

task copyJar(type: Copy, dependsOn: 'obfuscate') {
//    from "$buildDir/libs/$project.name/${jarName}.jar"
//    into "/home/nesfan/Desktop/Server-1.12.2/plugins/"
}

tasks.register('obfuscate') {
    doLast {
        def execDir = 'C:\\Users\\fynrae\\Desktop\\Project\\XacMinhClient\\Obfuscation'
        def obfDir = "$projectDir/Obfuscation"
        def ioDir = "$obfDir/in_out"

        delete {
            delete "$ioDir/lib"
            delete "$ioDir/BOOT-INF"
            delete "$ioDir/classes"
            delete "$ioDir/classes-obf"
//            delete "$ioDir/XacMinhServer"
        }
        copy {
            from "$buildDir/libs/${jarName}.jar"
            into "$ioDir"
        }
        exec {
            workingDir "$buildDir/libs"
            commandLine 'jar', 'xf', "${jarName}.jar", 'BOOT-INF/classes/me'
        }
        exec {
            workingDir "$buildDir/libs"
            commandLine 'jar', 'xf', "${jarName}.jar", 'BOOT-INF/classes/a'
        }
        exec {
            workingDir "$buildDir/libs"
            commandLine 'jar', 'xf', "${jarName}.jar", 'BOOT-INF/lib'
        }
        exec {
            workingDir "$buildDir/libs"
            commandLine 'jar', 'xf', "${jarName}.jar", 'META-INF/MANIFEST.MF'
        }
        ant.move file: "$buildDir/libs/BOOT-INF/classes", todir: ioDir
        ant.move file: "$buildDir/libs/BOOT-INF/lib", todir: ioDir
        ant.move file: "$buildDir/libs/META-INF", todir: ioDir
        exec {
            workingDir obfDir
            commandLine 'cmd', '/c', "$execDir/proguard-7.6.0/bin/proguard.bat", '@proguard.pro',
                    "-injars", "$ioDir/classes",
                    "-injars", "$ioDir/META-INF",
                    "-outjars", "$ioDir/classes-obf",
                    "-libraryjars", "$java8Path/jre/lib",
                    "-libraryjars", "$ioDir/lib",
                    "-libraryjars", "$buildDir/libs/libs",
                    "-printmapping", "$obfDir/mapping"
        }
        // BEGIN EDIT
//        exec {
//            workingDir ioDir
//            commandLine 'jar', 'xf', "${jarName}-obf.jar", "BOOT-INF/classes"
//        }
//        copy {
//            from "$ioDir/BOOT-INF/classes/"
//            include "**/*"
//            into "$ioDir/classes-obf"
//        }
//        //ant.move file: "$ioDir/BOOT-INF/classes/", todir: "$ioDir/classes-obf"
//        delete {
//            delete "$ioDir/BOOT-INF"
//        }
        // END
        exec {
            workingDir obfDir
            executable "$java8Path/bin/java"
            args '-noverify', '-jar', "$execDir/Stringer9/stringer.jar",
                    '-configFile', 'stringer-config.xml',
                    '-proguardMapFile', 'mapping',
                    "$ioDir/classes-obf", "$ioDir/BOOT-INF/classes"
        }
        exec {
            executable 'C:\\Program Files\\7-Zip\\7z.exe'
            workingDir obfDir
            args 'd', '-r', "$ioDir/${jarName}.jar", "BOOT-INF/classes/me"
        }
        exec {
            workingDir ioDir
            commandLine 'jar', 'uf', "${jarName}.jar", 'BOOT-INF/'
        }

        copy {
            from "$ioDir/classes-obf/MANIFEST.MF"
            into "$ioDir/META-INF/"
        }
        exec {
            workingDir ioDir
            executable 'C:\\Program Files\\7-Zip\\7z.exe'
            args 'u', '-r', "${jarName}.jar", 'META-INF/'
        }

        ant.move file: "$ioDir/${jarName}.jar", todir: "$projectDir/Release"
    }
}

assemble.finalizedBy obfuscate